<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fffaf4" />
<title>今天好難決定｜V6.2 首次語言選擇修正版</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#241d18;--muted:#88786d;--line:#eadfd5;--accent:#ff7448;--accent2:#f4b942;--shadow:0 18px 50px rgba(82,52,30,.12)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 50% -10%,#fff3df 0,#fffaf4 43%,#f9f2ea 100%);color:var(--ink);min-height:100dvh}
button,select,input{font:inherit}.app{max-width:560px;margin:auto;min-height:100dvh;padding:18px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;height:48px}.brand{font-weight:950;letter-spacing:-.04em;font-size:22px}.icon-btn{border:0;background:transparent;width:42px;height:42px;border-radius:50%;font-size:21px;cursor:pointer}.icon-btn:active{transform:scale(.94)}
main{flex:1;display:flex;flex-direction:column}.home{display:flex;flex-direction:column;justify-content:center;flex:1;padding:18px 0 12px}.eyebrow{text-align:center;color:var(--muted);font-weight:800;font-size:14px}.home h1{text-align:center;font-size:38px;line-height:1.08;margin:10px 0 8px;letter-spacing:-.055em}.lead{text-align:center;color:var(--muted);margin:0 0 30px;font-weight:650}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{border:1px solid var(--line);background:rgba(255,255,255,.88);border-radius:28px;padding:24px 16px 20px;box-shadow:var(--shadow);cursor:pointer;min-height:190px;text-align:left;position:relative;overflow:hidden}.mode:active{transform:translateY(2px) scale(.985)}.mode .emoji{font-size:57px;display:block;margin-bottom:19px}.mode strong{display:block;font-size:25px;letter-spacing:-.04em}.mode small{display:block;color:var(--muted);font-weight:750;margin-top:6px}.mode:after{content:"→";position:absolute;right:17px;bottom:15px;font-weight:900;font-size:24px;color:var(--accent)}
.status{text-align:center;margin-top:22px;color:var(--muted);font-size:13px;font-weight:700;min-height:20px}
.play{display:none;flex-direction:column;flex:1}.play.active{display:flex}.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);font-weight:850;padding:8px 0;cursor:pointer}.mode-title{text-align:center;font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.1em;margin:4px 0 2px}.question{text-align:center;font-size:30px;margin:3px 0 7px;letter-spacing:-.05em}.hint{text-align:center;color:var(--muted);font-weight:700;margin:0 0 16px}
.stage{height:330px;position:relative;display:grid;place-items:center;cursor:pointer;user-select:none;outline:none}.glow{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,73,.34),rgba(255,193,73,0) 68%);opacity:0;transform:scale(.4);transition:.35s}.stage.opening .glow,.stage.revealed .glow{opacity:1;transform:scale(1.35)}
.cloche{position:absolute;width:250px;height:190px;transition:transform .62s cubic-bezier(.2,.85,.25,1),opacity .35s;filter:drop-shadow(0 18px 16px rgba(68,42,23,.18));z-index:3}.stage.opening .cloche,.stage.revealed .cloche{transform:translateY(-160px) rotate(-7deg);opacity:.05}.handle{position:absolute;width:66px;height:34px;border-radius:34px 34px 10px 10px;background:linear-gradient(#f2f5f6,#b7c0c4);border:4px solid #929ca1;left:92px;top:13px}.dome{position:absolute;left:15px;top:40px;width:220px;height:115px;border-radius:115px 115px 14px 14px;background:linear-gradient(145deg,#f9fbfc,#c7cfd3 52%,#aab4b9);border:5px solid #899399}.tray{position:absolute;left:0;top:148px;width:250px;height:31px;border-radius:50%;background:linear-gradient(#dfe5e8,#aab3b8);border:5px solid #899399}.face{position:absolute;left:89px;top:88px;width:72px;height:38px}.eye{position:absolute;top:4px;width:8px;height:8px;border-radius:50%;background:#34383a}.eye.l{left:8px}.eye.r{right:8px}.mouth{position:absolute;left:25px;top:18px;width:23px;height:11px;border-bottom:4px solid #34383a;border-radius:50%}
.result{position:absolute;width:min(100%,340px);opacity:0;transform:translateY(25px) scale(.93);transition:.5s .18s cubic-bezier(.2,.8,.2,1);z-index:2}.stage.revealed .result{opacity:1;transform:none}.photo{height:215px;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,#f8d29d,#e88961);box-shadow:var(--shadow);position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:92px;background:linear-gradient(145deg,#ffe0b7,#f59b72)}.photo img:not([src]),.photo img[src=""]{display:none}.result-name{text-align:center;font-size:36px;font-weight:1000;letter-spacing:-.055em;margin-top:13px}.result-sub{text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.open-btn{border:0;border-radius:18px;background:var(--ink);color:#fff;font-weight:950;font-size:18px;padding:17px 20px;min-height:58px;box-shadow:0 12px 28px rgba(36,29,24,.2);cursor:pointer}.open-btn:active{transform:translateY(2px)}.actions{display:none;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.actions.show{display:grid}.action{border:2px solid var(--line);background:#fff;border-radius:19px;padding:13px 6px;min-height:70px;font-size:15px;font-weight:950;cursor:pointer;box-shadow:0 8px 20px rgba(82,52,30,.07)}.action:active{transform:translateY(2px);background:#fffaf4}.action .aicon{display:block;font-size:25px;margin-bottom:4px}.again{display:none;width:100%;min-height:58px;margin:12px 0 0;border:2px solid #d9c9bb;background:#fffaf4;border-radius:18px;color:var(--ink);font-size:17px;font-weight:950;padding:14px 18px;cursor:pointer;box-shadow:0 8px 20px rgba(82,52,30,.06)}.again:active{transform:translateY(2px);background:#fff3e8}.again.show{display:block}
.sheet-back{position:fixed;inset:0;background:rgba(30,23,18,.34);opacity:0;pointer-events:none;transition:.25s;z-index:20}.sheet-back.show{opacity:1;pointer-events:auto}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,600px);background:#fff;border-radius:28px 28px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));z-index:21;transition:.32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -22px 60px rgba(32,20,10,.18)}.sheet.show{transform:translate(-50%,0)}.grab{width:44px;height:5px;border-radius:5px;background:#ddd;margin:0 auto 14px}.sheet h2{font-size:24px;margin:0 0 4px;letter-spacing:-.04em}.sheet p{color:var(--muted);font-weight:650;margin:0 0 15px}.link-row{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin-top:9px;font-weight:900;cursor:pointer}.deal-best{border:1px solid #f4d59d;background:#fff8e8;border-radius:18px;padding:15px;margin:10px 0}.deal-best b{display:block;font-size:17px}.deal-best small{color:var(--muted);font-weight:700}.note{font-size:12px!important;margin-top:12px!important}
dialog{border:0;border-radius:24px;width:min(90vw,430px);padding:0;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(30,23,18,.35)}.settings{padding:22px}.settings h2{margin:0 0 4px}.settings p{color:var(--muted);font-weight:650;margin-top:0}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-weight:800}.close{width:100%;border:0;border-radius:15px;background:var(--ink);color:#fff;padding:13px;font-weight:900;margin-top:10px}.language-picker{padding:26px}.language-picker h2{margin:0;text-align:center;font-size:27px}.language-picker p{text-align:center;color:var(--muted);font-weight:700;margin:8px 0 20px}.language-options{display:grid;gap:12px}.language-choice{width:100%;min-height:64px;border:2px solid var(--line);background:#fff;border-radius:18px;font-size:19px;font-weight:950;cursor:pointer}.language-choice:active{transform:translateY(2px);background:#fff7ef}


/* V6 經典阿蓋：保留原本圓潤銀色餐蓋角色 */
.classic-wrap{height:78px;display:flex;align-items:flex-end;justify-content:center;margin:2px 0 0}
.classic-agai{position:relative;width:100px;height:66px;filter:drop-shadow(0 10px 10px rgba(53,45,37,.14));transition:.25s}
.classic-shell{position:absolute;inset:8px 3px 0;border:3px solid #8d989f;border-radius:58px 58px 19px 19px;background:linear-gradient(145deg,#f8fafb 0,#d8dee2 45%,#aeb8be 100%);box-shadow:inset 13px 10px 18px rgba(255,255,255,.7),inset -10px -9px 15px rgba(108,122,131,.18)}
.classic-knob{position:absolute;z-index:2;left:50%;top:-2px;transform:translateX(-50%);width:33px;height:20px;border:3px solid #8d989f;border-radius:18px 18px 7px 7px;background:linear-gradient(#f4f6f7,#b8c1c7)}
.classic-face{position:absolute;z-index:3;left:50%;top:30px;width:66px;height:28px;transform:translateX(-50%)}
.classic-eye{position:absolute;top:2px;width:7px;height:7px;border-radius:50%;background:#303437;transition:.2s}.classic-eye.l{left:10px}.classic-eye.r{right:10px}
.classic-mouth{position:absolute;left:50%;top:13px;width:20px;height:9px;transform:translateX(-50%);border-bottom:4px solid #404447;border-radius:50%;transition:.2s}
.classic-agai.bounce{animation:classicBounce .48s ease}@keyframes classicBounce{45%{transform:translateY(-9px) rotate(-3deg)}70%{transform:translateY(2px) rotate(2deg)}}
.classic-agai.mood-annoyed .classic-eye{height:4px;border-radius:4px}.classic-agai.mood-annoyed .classic-eye.l{transform:rotate(12deg)}.classic-agai.mood-annoyed .classic-eye.r{transform:rotate(-12deg)}
.classic-agai.mood-angry .classic-eye{height:4px;border-radius:4px}.classic-agai.mood-angry .classic-eye.l{transform:rotate(25deg)}.classic-agai.mood-angry .classic-eye.r{transform:rotate(-25deg)}.classic-agai.mood-angry .classic-mouth{border-bottom:0;border-top:4px solid #404447;top:20px}
.classic-agai.mood-smug .classic-eye{height:4px;border-radius:4px}.classic-agai.mood-smug .classic-mouth{width:16px;transform:translateX(-40%) rotate(-12deg)}
.classic-agai.mood-tired .classic-eye{height:3px;top:6px}.classic-agai.mood-tired .classic-mouth{width:15px;border-radius:0}

/* V5.3 阿蓋表情與彩蛋 */
.cloche.mood-annoyed .eye{height:5px;border-radius:4px;transform:rotate(12deg)}.cloche.mood-annoyed .eye.r{transform:rotate(-12deg)}
.cloche.mood-angry .eye{height:5px;border-radius:4px}.cloche.mood-angry .eye.l{transform:rotate(25deg)}.cloche.mood-angry .eye.r{transform:rotate(-25deg)}.cloche.mood-angry .mouth{border-bottom:0;border-top:4px solid #34383a;top:24px}
.cloche.mood-smug .eye{height:4px;border-radius:4px}.cloche.mood-smug .mouth{width:20px;left:30px;transform:rotate(-13deg)}
.cloche.mood-tired .eye{height:3px;border-radius:3px;top:8px}.cloche.mood-tired .mouth{width:18px;left:28px;border-bottom:3px solid #34383a}
.mascot-talk{position:absolute;top:8px;left:50%;transform:translate(-50%,-8px) scale(.96);max-width:92%;background:#241d18;color:#fff;padding:10px 14px;border-radius:16px;font-weight:900;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;z-index:9;transition:.24s}.mascot-talk.show{opacity:1;transform:translate(-50%,0) scale(1)}.mascot-talk:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:9px solid transparent;border-top-color:#241d18;border-bottom:0}
.special-flash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle,#fff9c7 0,#ffbf3f 32%,rgba(255,116,72,.94) 75%);opacity:0;pointer-events:none;transition:.28s}.special-flash.show{opacity:1;pointer-events:auto}.special-card{text-align:center;color:#241d18;transform:scale(.75);transition:.35s cubic-bezier(.2,.9,.2,1)}.special-flash.show .special-card{transform:scale(1)}.special-emoji{font-size:100px;filter:drop-shadow(0 14px 18px rgba(70,35,10,.22));animation:floaty .8s ease-in-out infinite alternate}.special-title{font-size:34px;font-weight:1000;margin:12px 18px 5px;letter-spacing:-.05em}.special-text{font-size:17px;font-weight:850;margin:0 24px 22px}.special-close{border:0;background:#241d18;color:#fff;border-radius:18px;padding:14px 24px;min-width:180px;font-weight:950;font-size:17px}@keyframes floaty{to{transform:translateY(-12px) rotate(4deg)}}
.stage.special .glow{background:radial-gradient(circle,rgba(255,232,88,.9),rgba(255,121,41,.35) 45%,transparent 70%);opacity:1;transform:scale(1.7);animation:pulseGlow .65s ease-in-out infinite alternate}@keyframes pulseGlow{to{transform:scale(2.05);filter:brightness(1.25)}}

/* V6：有節奏的抽選、差一點的遺失感 */
.slot-preview{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;width:min(88%,360px);min-height:92px;padding:15px 18px;border:2px solid rgba(234,223,213,.95);border-radius:25px;background:rgba(255,255,255,.94);box-shadow:0 18px 45px rgba(58,39,25,.14);opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;transition:.2s}
.slot-preview.show{opacity:1;transform:none}.slot-preview.fake-stop{animation:fakeStop .34s ease-in-out 2}.slot-emoji{font-size:46px;line-height:1}.slot-name{font-size:27px;font-weight:1000;letter-spacing:-.045em}.slot-caption{font-size:12px;color:var(--muted);font-weight:850;margin-top:3px}
@keyframes fakeStop{50%{transform:scale(1.035);box-shadow:0 20px 55px rgba(255,116,72,.22)}}
.almost{display:none;text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin:10px 0 0;min-height:20px}.almost.show{display:block}.almost b{color:var(--ink)}
.copy-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,20px);background:#241d18;color:#fff;border-radius:999px;padding:11px 17px;font-weight:900;opacity:0;pointer-events:none;transition:.25s}.copy-toast.show{opacity:1;transform:translate(-50%,0)}
.stage.rolling .cloche{transform:translateY(-36px) rotate(-2deg)}.stage.rolling .glow{opacity:.42;transform:scale(.9)}
.classic-agai.watching .classic-eye.l,.classic-agai.watching .classic-eye.r{animation:eyeTrack .34s ease-in-out infinite alternate}@keyframes eyeTrack{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@media(max-width:390px){.actions{grid-template-columns:repeat(2,1fr)}.action{font-size:13px;padding:11px 4px}.action .aicon{font-size:22px}}

@media(max-width:380px){.home h1{font-size:33px}.mode{min-height:170px}.mode strong{font-size:22px}.stage{height:315px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand" id="brand">今天好難決定</div><button class="icon-btn" id="settingsBtn" aria-label="偏好設定">♡</button></header>
<main>
<section class="home" id="home">

<div class="mode-grid">

</div><div class="status" id="locationStatus">📍 正在準備附近選項…</div>
</section>

<div class="result"><div class="photo"><div class="fallback" id="fallback">🍜</div><img id="resultImg" alt=""></div><div class="result-name" id="resultName">拉麵</div><div class="result-sub" id="resultSub">附近就有，去看看吧。</div></div>
</div>
<div class="almost" id="almostMissed"></div>
<button class="open-btn" id="openBtn">開蓋決定</button>
<div class="actions" id="actions"><button class="action" id="mapBtn"><span class="aicon">📍</span><span id="mapText">去吃</span></button><button class="action" id="deliveryBtn"><span class="aicon">🛵</span><span id="deliveryText">外送</span></button></div>
<button class="again" id="againBtn">🔄 不想要，換一個</button>
</section></main></div>
<div class="copy-toast" id="copyToast">已複製</div>
<div class="sheet-back" id="backdrop"></div>
<section class="sheet" id="deliverySheet"><div class="grab"></div><h2 id="deliveryTitle">選外送平台</h2><p id="deliveryHint">搜尋附近餐點</p><button class="link-row" id="uberBtn">Uber Eats <span>→</span></button><button class="link-row" id="pandaBtn">foodpanda <span>→</span></button><button class="link-row" id="googleDeliveryBtn">Google 地圖外送 <span>→</span></button></section>


<dialog id="languageDialog"><div class="language-picker"><h2>Choose your language</h2><p>請選擇語言・言語を選択</p><div class="language-options"><button class="language-choice" data-lang="zh">繁體中文</button><button class="language-choice" data-lang="en">English</button><button class="language-choice" data-lang="ja">日本語</button></div></div></dialog>
<div class="special-flash" id="specialFlash"><div class="special-card"><div class="special-emoji" id="specialEmoji">✨</div><div class="special-title" id="specialTitle">神奇開蓋！</div><p class="special-text" id="specialText">阿蓋今天突然很有戲。</p><button class="special-close" id="specialClose">繼續抽</button></div></div>

<script>

const $=id=>document.getElementById(id);
const foods=[

{id:'beefnoodle',zh:'牛肉麵',en:'Beef Noodles',ja:'牛肉麺',q:'牛肉麵',tag:'beef',emoji:'🍜',img:'https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=900&q=80'},
{id:'lurou',zh:'滷肉飯',en:'Braised Pork Rice',ja:'魯肉飯',q:'滷肉飯',tag:'rice',emoji:'🍚',img:'https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=900&q=80'},
{id:'dumpling',zh:'水餃',en:'Dumplings',ja:'餃子',q:'水餃',tag:'dumpling',emoji:'🥟',img:'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=900&q=80'},
{id:'hotpot',zh:'火鍋',en:'Hot Pot',ja:'鍋料理',q:'火鍋',tag:'spicy',emoji:'🍲',img:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80'},
{id:'friedchicken',zh:'炸雞',en:'Fried Chicken',ja:'フライドチキン',q:'炸雞',tag:'chicken',emoji:'🍗',img:'https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=900&q=80'},

const LANGUAGE_KEY='today-hard-to-decide-v62-lang';const savedLang=localStorage.getItem(LANGUAGE_KEY);let lang=savedLang||'zh',mode=null,current=null,coords=null,opening=false,nearby={food:[],drink:[]},drawCount=0,lastMood='normal';

function setMood(mood='normal'){const targets=[document.querySelector('.cloche'),document.querySelector('#classicAgai')].filter(Boolean);targets.forEach(c=>{c.classList.remove('mood-annoyed','mood-angry','mood-smug','mood-tired');if(mood!=='normal')c.classList.add('mood-'+mood)});const agai=document.querySelector('#classicAgai');if(agai){agai.classList.remove('bounce');void agai.offsetWidth;agai.classList.add('bounce');setTimeout(()=>agai.classList.remove('bounce'),520)}lastMood=mood}
function say(text,ms=2400){const b=$('mascotTalk');b.textContent=text;b.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>b.classList.remove('show'),ms)}
function milestone(){const pack=EASTER[lang];const hit=pack[drawCount];if(hit){setMood(hit[0]);say(hit[1],3300);return true}if(drawCount>20&&drawCount%10===0){setMood('tired');say(lang==='zh'?'你很有毅力，但阿蓋沒有。':lang==='ja'?'あなたは元気。でもアガイは限界。':'You have stamina. I do not.',3000);return true}return false}
function showSpecial(){const pack=EASTER[lang];const texts=pack.specialText;$('specialTitle').textContent=pack.specialTitle;$('specialText').textContent=texts[Math.floor(Math.random()*texts.length)];$('specialClose').textContent=pack.continue;$('specialEmoji').textContent=mode==='drink'?'🧋✨':'🍜✨';$('stage').classList.add('special');$('specialFlash').classList.add('show')}
function closeSpecial(){$('specialFlash').classList.remove('show');$('stage').classList.remove('special')}

function applyText(){const t=tr();['brand','eyebrow','homeTitle','homeLead','findFood','foodSmall','findDrink','drinkSmall'].forEach(k=>$(k).textContent=t[k]);$('backBtn').textContent=t.back;$('modeTitle').textContent=mode==='drink'?t.drinkMode:t.foodMode;$('question').textContent=mode==='drink'?t.drinkQ:t.foodQ;$('hint').textContent=t.hint;$('openBtn').textContent=t.open;$('mapText').textContent=mode==='drink'?t.mapDrink:t.mapFood;$('deliveryText').textContent=t.delivery;$('againBtn').textContent=t.again;$('deliveryTitle').textContent=t.deliveryTitle;$('settingsTitle').textContent=t.settings;$('settingsIntro').textContent=t.settingsIntro;$('languageLabel').textContent=t.language;$('noBeefLabel').textContent=t.noBeef;$('noSpicyLabel').textContent=t.noSpicy;$('vegFirstLabel').textContent=t.vegFirst;$('closeSettings').textContent=t.done;$('locationStatus').textContent=coords?t.ready:t.loading;if(current){$('resultName').textContent=nameOf(current);$('resultSub').textContent=t.near}}
function savePrefs(){['noBeef','noSpicy','vegFirst'].forEach(k=>localStorage.setItem('pref_'+k,$(k).checked?'1':'0'))}
function loadPrefs(){['noBeef','noSpicy','vegFirst'].forEach(k=>$(k).checked=localStorage.getItem('pref_'+k)==='1')}
function filteredPool(){let pool=(nearby[mode].length?nearby[mode]:(mode==='drink'?drinks:foods)).slice();if(mode==='food') pool=pool.filter(x=>!($('noBeef').checked&&x.tag==='beef')&&!($('noSpicy').checked&&x.tag==='spicy'));if($('vegFirst').checked&&mode==='food'){const veg=pool.filter(x=>['rice','noodle','dumpling','western'].includes(x.tag));if(veg.length)pool=veg}return pool.length?pool:(mode==='drink'?drinks:foods)}
function choose(){const pool=filteredPool();let next=pool[Math.floor(Math.random()*pool.length)];if(pool.length>1&&current&&next.id===current.id)next=pool[(pool.indexOf(next)+1)%pool.length];return next}
function showResult(item,almostItem=null){current=item;$('resultName').textContent=nameOf(item);$('resultSub').textContent=tr().near;$('fallback').textContent=item.emoji;const img=$('resultImg');img.style.display='block';img.onerror=()=>{img.style.display='none'};img.src=item.img;$('slotPreview').classList.remove('show','fake-stop');$('stage').classList.remove('rolling','opening');$('stage').classList.add('revealed');$('classicAgai').classList.remove('watching');$('openBtn').style.display='none';$('actions').classList.add('show');$('againBtn').classList.add('show');const almost=$('almostMissed');if(almostItem&&almostItem.id!==item.id){almost.innerHTML=tr().almost+'<b>'+almostItem.emoji+' '+nameOf(almostItem)+'</b>';almost.classList.add('show')}else{almost.classList.remove('show');almost.textContent=''}opening=false;if(navigator.vibrate)navigator.vibrate([18,35,28])}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function preview(item,caption){$('slotEmoji').textContent=item.emoji;$('slotName').textContent=nameOf(item);$('slotCaption').textContent=caption;$('slotPreview').classList.add('show')}
async function draw(){if(opening)return;opening=true;drawCount++;$('actions').classList.remove('show');$('againBtn').classList.remove('show');$('almostMissed').classList.remove('show');$('openBtn').style.display='none';$('stage').classList.remove('revealed','opening');$('stage').classList.add('rolling');$('classicAgai').classList.add('watching');const pool=filteredPool(),item=choose();let sequence=[];for(let i=0;i<8;i++)sequence.push(pool[Math.floor(Math.random()*pool.length)]);sequence.push(item);const milestoneHit=milestone();const rare=!milestoneHit&&Math.random()<0.05;if(!milestoneHit&&drawCount%4===0){const moods=['annoyed','smug','tired'];setMood(moods[Math.floor(Math.random()*moods.length)])}else if(!milestoneHit&&!rare){setMood('normal')}
const delays=[90,105,125,155,195,250,340,470];for(let i=0;i<8;i++){preview(sequence[i],tr().rolling);await wait(delays[i])}
let almostItem=sequence[7];const doFake=Math.random()<0.72;if(doFake){preview(almostItem,tr().finalizing);$('slotPreview').classList.add('fake-stop');setMood('annoyed');await wait(720);$('slotPreview').classList.remove('fake-stop');await wait(120)}
preview(item,tr().finalizing);await wait(480);$('stage').classList.remove('rolling');$('stage').classList.add('opening');$('classicAgai').classList.remove('watching');await wait(430);showResult(item,doFake&&Math.random()<0.72?almostItem:null);if(rare)setTimeout(showSpecial,360)}
function reset(){opening=false;current=null;drawCount=0;setMood('normal');$('classicAgai').classList.remove('watching');$('mascotTalk').classList.remove('show');$('slotPreview').classList.remove('show','fake-stop');$('almostMissed').classList.remove('show');$('stage').classList.remove('rolling','opening','revealed','special');$('actions').classList.remove('show');$('againBtn').classList.remove('show');$('openBtn').style.display='block'}
function enterMode(m){mode=m;$('home').style.display='none';$('play').classList.add('active');reset();applyText()}
function query(){return current?current.q:''}
function mapUrl(extra=''){const q=encodeURIComponent((coords?'附近 ':'')+query()+' '+extra);return coords?`https://www.google.com/maps/search/?api=1&query=${q}&center=${coords.lat},${coords.lng}`:`https://www.google.com/maps/search/?api=1&query=${q}`}
function openSheet(id){$('backdrop').classList.add('show');$(id).classList.add('show')}
function closeSheets(){$('backdrop').classList.remove('show');document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('show'))}
function openUber(){window.open('https://www.ubereats.com/search?q='+encodeURIComponent(query()),'_blank')}
async function copyCurrent(){if(!current)return;try{await navigator.clipboard.writeText(query())}catch(e){const ta=document.createElement('textarea');ta.value=query();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const toast=$('copyToast');toast.textContent=tr().copied+nameOf(current);toast.classList.add('show');clearTimeout(copyCurrent.timer);copyCurrent.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
function openPanda(){navigator.clipboard?.writeText(query()).catch(()=>{});window.open('https://www.foodpanda.com.tw/restaurants/new?query='+encodeURIComponent(query()),'_blank')}
async function loadNearby(){if(!navigator.geolocation){$('locationStatus').textContent=tr().fallback;return}navigator.geolocation.getCurrentPosition(async p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude};applyText();try{const body=`[out:json][timeout:8];(node[amenity~"restaurant|fast_food|cafe"](around:4000,${coords.lat},${coords.lng});way[amenity~"restaurant|fast_food|cafe"](around:4000,${coords.lat},${coords.lng}););out tags 80;`;const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body});const d=await r.json();const text=d.elements.map(e=>`${e.tags?.name||''} ${e.tags?.cuisine||''}`.toLowerCase()).join(' | ');nearby.food=foods.filter(x=>text.includes(x.q.toLowerCase())||({ramen:['ramen','拉麵'],dumpling:['dumpling','餃子','水餃'],burger:['burger','漢堡'],pizza:['pizza','披薩'],sushi:['sushi','壽司'],coffee:['coffee','咖啡']}[x.id]||[]).some(k=>text.includes(k)));nearby.drink=drinks.filter(x=>text.includes(x.q.toLowerCase())||(['coffee','latte'].includes(x.id)&&text.includes('cafe'))); }catch(e){}},()=>{$('locationStatus').textContent=tr().fallback},{timeout:7000,maximumAge:600000})}

document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>enterMode(b.dataset.mode));$('backBtn').onclick=()=>{$('play').classList.remove('active');$('home').style.display='flex';mode=null;reset();applyText()};$('openBtn').onclick=draw;$('stage').onclick=()=>{if(!$('stage').classList.contains('revealed'))draw()};$('stage').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();draw()}};$('againBtn').onclick=draw;$('mapBtn').onclick=()=>window.open(mapUrl(),'_blank');$('deliveryBtn').onclick=async()=>{await copyCurrent();$('deliveryHint').textContent=query();openSheet('deliverySheet')};$('backdrop').onclick=closeSheets;$('uberBtn').onclick=openUber;$('pandaBtn').onclick=openPanda;$('googleDeliveryBtn').onclick=()=>window.open(mapUrl('外送'),'_blank');$('specialClose').onclick=closeSpecial;$('specialFlash').onclick=e=>{if(e.target===$('specialFlash'))closeSpecial()};
const dlg=$('settingsDialog');$('settingsBtn').onclick=()=>dlg.showModal();$('closeSettings').onclick=()=>{savePrefs();dlg.close()};$('languageSelect').value=lang;$('languageSelect').onchange=e=>{lang=e.target.value;localStorage.setItem(LANGUAGE_KEY,lang);document.documentElement.lang=lang==='zh'?'zh-Hant':lang;applyText()};const languageDlg=$('languageDialog');document.querySelectorAll('.language-choice').forEach(btn=>btn.onclick=()=>{lang=btn.dataset.lang;localStorage.setItem(LANGUAGE_KEY,lang);$('languageSelect').value=lang;document.documentElement.lang=lang==='zh'?'zh-Hant':lang;applyText();languageDlg.close();loadNearby()});loadPrefs();applyText();if(!savedLang){languageDlg.showModal()}else{document.documentElement.lang=lang==='zh'?'zh-Hant':lang;loadNearby()}
