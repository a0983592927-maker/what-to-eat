<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>今天吃什麼？</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#0d0d0f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 15%,rgba(255,178,76,.18),transparent 30%),radial-gradient(circle at 85% 75%,rgba(255,79,120,.14),transparent 32%),#0d0d0f}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:34px 22px 28px;display:flex;flex-direction:column;text-align:center}.eyebrow{letter-spacing:.28em;font-size:.72rem;color:#ffbd66;margin:0 0 12px}h1{font-size:clamp(2.35rem,10vw,4.2rem);line-height:.98;margin:0}.sub{margin:14px 0 0;color:#aaa}.stage{flex:1;min-height:380px;display:grid;place-items:center}.box{border:0;width:220px;height:220px;border-radius:44px;background:linear-gradient(145deg,#ffbd66,#ff784f);box-shadow:0 28px 80px rgba(255,124,79,.3);color:#17120d;display:grid;align-content:center;gap:10px}.gift{font-size:6.5rem}.label{font-weight:850;font-size:1.15rem}.card{width:100%;padding:36px 22px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);border-radius:36px}.emoji{font-size:8rem;line-height:1}.prefix{color:#aaa;margin:22px 0 4px}.card h2{font-size:3rem;margin:0}.controls{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}.controls button,.modal button{border:0;border-radius:18px;padding:16px 18px;font-weight:800}.primary{background:#ffbd66;color:#18120b}.secondary{background:rgba(255,255,255,.1);color:#fff}.status{padding-top:22px;color:#888;font-size:.9rem}.status strong{color:#ffbd66;font-size:1.35rem}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:22px}.modal-box{width:min(100%,420px);background:#19191d;border-radius:30px;padding:32px 26px}.modal .face{font-size:4rem}.modal h2{font-size:2rem;margin:10px 0}.modal p{color:#bbb;line-height:1.5}.modal button{width:100%;background:#ffbd66;color:#17120d;margin-top:12px}
</style></head><body><main class="app"><header><p class="eyebrow">WHAT TO EAT?</p><h1>今天吃什麼？</h1><p class="sub">別想了，交給命運。</p></header><section class="stage"><button id="draw" class="box"><span class="gift">🎁</span><span class="label">開盲盒</span></button><article id="card" class="card hidden"><div id="emoji" class="emoji">🍔</div><p class="prefix">今天就吃</p><h2 id="name">漢堡</h2></article></section><section class="controls"><button id="accept" class="secondary hidden">就它了</button><button id="again" class="primary hidden">不服，再抽</button></section><section class="status">本輪剩餘 <strong id="count">5</strong> 次<p>每 6 小時恢復 5 次。</p></section></main><div id="modal" class="modal hidden"><div class="modal-box"><div class="face">😐</div><h2>你根本不餓</h2><p>五個答案都不要，問題可能不是食物。</p><button id="close">好啦</button></div></div><script>
const foods=[['漢堡','🍔'],['披薩','🍕'],['拉麵','🍜'],['壽司','🍣'],['咖哩飯','🍛'],['水餃','🥟'],['炸雞','🍗'],['火鍋','🍲'],['便當','🍱'],['牛排','🥩'],['三明治','🥪'],['義大利麵','🍝'],['墨西哥捲餅','🌯'],['烤肉','🍖'],['海鮮','🦐']];const MAX=5,RESET=21600000,key='wte_single';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{};if(!state||Date.now()>=state.resetAt)state={used:0,resetAt:Date.now()+RESET};let current='';const $=s=>document.querySelector(s);function save(){localStorage.setItem(key,JSON.stringify(state));$('#count').textContent=Math.max(0,MAX-state.used)}function pick(){if(state.used>=MAX){$('#modal').classList.remove('hidden');return}state.used++;save();let f;do{f=foods[Math.floor(Math.random()*foods.length)]}while(f[0]===current);current=f[0];$('#emoji').textContent=f[1];$('#name').textContent=f[0];$('#draw').classList.add('hidden');$('#card').classList.remove('hidden');$('#accept').classList.remove('hidden');$('#again').classList.remove('hidden')}$('#draw').onclick=pick;$('#again').onclick=pick;$('#accept').onclick=()=>alert('決定了：今天就吃'+current+'！');$('#close').onclick=()=>$('#modal').classList.add('hidden');save();
</script></body></html>
